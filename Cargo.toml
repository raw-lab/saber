[package]
name = "saber-sw"
version = "1.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["Richard Allen White III <rwhit101@charlotte.edu>"]
description = "SABER: seeded Smith-Waterman homology search (AVX2, calibrated E-values) with BLAST-like output"
license = "CC-BY-NC-4.0"
homepage = "https://github.com/raw-lab/saber"
repository = "https://github.com/raw-lab/saber"
documentation = "https://docs.rs/saber"
readme = "README.md"
keywords = ["bioinformatics", "alignment", "blast", "homology", "smith-waterman"]
categories = ["science", "command-line-utilities"]
include = [
	"/src/**/*.rs",
	"/src/**/*.cu",
	"/Cargo.toml",
	"/README.md",
	"/LICENSE",
]

# Pinned to versions that work on Rust 1.75 (no edition2024 crates)
[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
clap_derive = "=4.4.7"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
num_cpus = "1.16"
lazy_static = "1.4"
libc = "0.2"
log = "0.4"
env_logger = "=0.10.2"
anyhow = "=1.0.89"
thiserror = "=1.0.69"

# Persistent on-disk index: memory-mapped reads (memmap2) + safe POD slice
# reinterpretation of the mapped bytes (bytemuck).
memmap2 = "0.9"
bytemuck = "1"

# CUDA backend. cudarc 0.9.15 supports NVRTC for runtime kernel compilation,
# which is what we use — the kernel source is embedded in the binary via
# include_str! and compiled when CudaExecutor::new() is called.
# Requires CUDA toolkit 11.0+ on the build/run host.
cudarc = { version = "=0.9.15", features = ["nvrtc"], optional = true }
ocl = { version = "0.19", optional = true }

[features]
default = []
gpu-cuda = ["cudarc"]
#gpu-opencl = ["ocl"]
gpu = ["gpu-cuda"]

[[bin]]
name = "saber"
path = "src/bin/main.rs"

[lib]
name = "saber_rs"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[[example]]
name = "bench_simd"
path = "examples/bench_simd.rs"

[[example]]
name = "mask_probs"
path = "examples/mask_probs.rs"

[[example]]
name = "engine_probe"
path = "examples/engine_probe.rs"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[example]]
name = "bench_kernels"
path = "examples/bench_kernels.rs"

[[example]]
name = "gpu_vectors"
path = "examples/gpu_vectors.rs"

[[example]]
name = "bench_banded"
path = "examples/bench_banded.rs"
